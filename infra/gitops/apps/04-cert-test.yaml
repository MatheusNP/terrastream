apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-test
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/MatheusNP/terrastream.git
    targetRevision: main
    path: infra/gitops/platform/cert-test
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-test
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true